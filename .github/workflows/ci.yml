name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain; a
          # dependency here requires 1.25 and a mismatch is how the repo
          # previously failed to build from a clean clone.
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The tool targets Windows services, so make sure it still compiles there.
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
